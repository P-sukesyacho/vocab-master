<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英単語クイズ Master</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #1f2937;
      --correct: #10b981;
      --wrong: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 1rem; display: flex; justify-content: center; min-height: 100vh; }
    .container { background: var(--card); border-radius: 12px; width: 100%; max-width: 500px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); height: fit-content; }
    h1 { font-size: 1.4rem; text-align: center; color: var(--primary); margin-bottom: 1rem; }
    .btn { background: var(--primary); color: white; border: none; padding: 0.8rem; border-radius: 8px; width: 100%; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 0.5rem; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #6b7280; }
    .btn-secondary:hover { background: #4b5563; }
    .hidden { display: none !important; }
    
    /* Config */
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 0.3rem; }
    select, input { width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem; }
    
    /* Quiz */
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; font-size: 0.85rem; color: #6b7280; }
    .timer { font-size: 1.1rem; font-weight: bold; color: var(--wrong); }
    .word-card { text-align: center; margin: 1rem 0; padding: 1rem; background: #f9fafb; border-radius: 8px; border: 1px solid #e5e7eb; position: relative; }
    .word { font-size: 2rem; font-weight: bold; }
    .unit-badge { font-size: 0.8rem; background: #e0e7ff; color: var(--primary); padding: 2px 8px; border-radius: 10px; }
    .mistake-alert { background: #fef3c7; color: #92400e; font-size: 0.85rem; padding: 0.4rem; border-radius: 6px; margin-top: 0.5rem; font-weight: bold; }
    
    .options { display: flex; flex-direction: column; gap: 0.6rem; }
    .opt-btn { padding: 0.8rem; border: 2px solid #e5e7eb; border-radius: 8px; background: white; text-align: left; font-size: 0.95rem; cursor: pointer; }
    .opt-btn.correct { background: #d1fae5; border-color: var(--correct); color: #065f46; }
    .opt-btn.wrong { background: #fee2e2; border-color: var(--wrong); color: #991b1b; }

    /* Stats */
    .history-list { max-height: 250px; overflow-y: auto; margin: 1rem 0; font-size: 0.9rem; }
    .history-item { padding: 0.5rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    .wrong-tag { color: var(--wrong); font-weight: bold; }
  </style>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>

<div class="container">
  <!-- Top / Settings -->
  <div id="screen-top">
    <h1>英単語クイズ (全172語)</h1>
    <div class="field">
      <label>出題モード</label>
      <select id="mode-select">
        <option value="all">全単語からランダム</option>
        <option value="weak">苦手（前回ミスした単語）のみ</option>
      </select>
    </div>
    <div class="field">
      <label>1問あたりの制限時間</label>
      <select id="timer-select">
        <option value="5">5秒 (超スピード)</option>
        <option value="10" selected>10秒 (標準)</option>
        <option value="15">15秒 (じっくり)</option>
        <option value="0">制限時間なし</option>
      </select>
    </div>
    <div class="field">
      <label>問題数</label>
      <select id="count-select">
        <option value="10">10問</option>
        <option value="20">20問</option>
        <option value="all">全問</option>
      </select>
    </div>
    <button class="btn" onclick="startQuiz()">クイズスタート</button>
    <button class="btn btn-secondary" onclick="showHistory()" style="margin-top:0.8rem;">苦手単語リストを見る</button>
  </div>

  <!-- Quiz -->
  <div id="screen-quiz" class="hidden">
    <div class="status-bar">
      <span id="q-progress">第 1 問</span>
      <span id="q-timer" class="timer">10s</span>
    </div>
    <div class="word-card">
      <span id="q-unit" class="unit-badge">Unit 116</span>
      <div id="q-word" class="word">word</div>
      <div id="q-alert" class="mistake-alert hidden">⚠️ 前回間違えた単語です！</div>
    </div>
    <div id="q-options" class="options"></div>
  </div>

  <!-- Result -->
  <div id="screen-result" class="hidden" style="text-align: center;">
    <h1>結果発表</h1>
    <p style="font-size: 2rem; font-weight: bold; color: var(--primary); margin: 1rem 0;" id="res-score">0 / 10</p>
    <div id="res-mistakes-box" style="text-align: left; margin-bottom: 1rem;"></div>
    <button class="btn" onclick="backToTop()">メニューに戻る</button>
  </div>

  <!-- History -->
  <div id="screen-history" class="hidden">
    <h1>苦手・記録リスト</h1>
    <p style="font-size:0.85rem; color:#6b7280; margin-bottom:0.5rem;">※端末内に記録されています</p>
    <div id="history-content" class="history-list"></div>
    <button class="btn btn-secondary" onclick="clearHistory()" style="margin-bottom:0.5rem; background:#ef4444;">記録をリセット</button>
    <button class="btn" onclick="backToTop()">戻る</button>
  </div>
</div>

let score = 0;
let timer = null;
let timeLeft = 0;
let timeLimit = 10;
let isAnswered = false;
let sessionMistakes = [];

function startQuiz() {
  const mode = document.getElementById("mode-select").value;
  timeLimit = parseInt(document.getElementById("timer-select").value);
  const countVal = document.getElementById("count-select").value;

  let pool = [...vocabulary];
  if (mode === "weak") {
    const mistakeWords = Object.keys(mistakes);
    pool = pool.filter(v => mistakeWords.includes(v.word));
    if (pool.length === 0) {
      alert("まだ間違えた記録のある単語がありません！");
      return;
    }
  }

  pool.sort(() => Math.random() - 0.5);
  const count = countVal === "all" ? pool.length : Math.min(parseInt(countVal), pool.length);
  quizList = pool.slice(0, count);

  currentIdx = 0;
  score = 0;
  sessionMistakes = [];

  showScreen("screen-quiz");
  nextQuestion();
}

function nextQuestion() {
  if (currentIdx >= quizList.length) {
    finishQuiz();
    return;
  }

  isAnswered = false;
  const item = quizList[currentIdx];

  document.getElementById("q-progress").innerText = `第 ${currentIdx + 1} 問 / ${quizList.length}問`;
  document.getElementById("q-unit").innerText = `Unit ${item.unit}`;
  document.getElementById("q-word").innerText = item.word;

  // Check if previously mistaked
  const alertEl = document.getElementById("q-alert");
  if (mistakes[item.word]) {
    alertEl.innerText = `⚠️ 前回間違えた単語です！（累積ミス: ${mistakes[item.word]}回）`;
    alertEl.classList.remove("hidden");
  } else {
    alertEl.classList.add("hidden");
  }

  // Generate Options
  let dummy = vocabulary
    .filter(v => v.meaning !== item.meaning)
    .sort(() => Math.random() - 0.5)
    .slice(0, 3)
    .map(v => v.meaning);
  let options = [item.meaning, ...dummy].sort(() => Math.random() - 0.5);

  const optsDiv = document.getElementById("q-options");
  optsDiv.innerHTML = "";
  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.innerText = opt;
    btn.onclick = () => handleAnswer(opt, item.meaning, btn);
    optsDiv.appendChild(btn);
  });

  // Timer setup
  if (timeLimit > 0) {
    timeLeft = timeLimit;
    document.getElementById("q-timer").innerText = `${timeLeft}s`;
    clearInterval(timer);
    timer = setInterval(() => {
      timeLeft--;
      document.getElementById("q-timer").innerText = `${timeLeft}s`;
      if (timeLeft <= 0) {
        clearInterval(timer);
        handleAnswer(null, item.meaning, null); // 時間切れは誤答
      }
    }, 1000);
  } else {
    document.getElementById("q-timer").innerText = "";
  }
}

function handleAnswer(selected, correct, btn) {
  if (isAnswered) return;
  isAnswered = true;
  clearInterval(timer);

  const item = quizList[currentIdx];
  const allBtns = document.querySelectorAll(".opt-btn");

  if (selected === correct) {
    score++;
    if (btn) btn.classList.add("correct");
    // 正解したらミスカウントを1減らす（またはクリア）
    if (mistakes[item.word]) {
      mistakes[item.word]--;
      if (mistakes[item.word] <= 0) delete mistakes[item.word];
    }
  } else {
    if (btn) btn.classList.add("wrong");
    // 時間切れまたは不正解の処理
    allBtns.forEach(b => {
      if (b.innerText === correct) b.classList.add("correct");
    });
    
    // 記録保存
    mistakes[item.word] = (mistakes[item.word] || 0) + 1;
    sessionMistakes.push(item);
  }

  // ローカルストレージ更新
  localStorage.setItem("vocab_mistakes", JSON.stringify(mistakes));

  setTimeout(() => {
    currentIdx++;
    nextQuestion();
  }, 1200);
}

function finishQuiz() {
  showScreen("screen-result");
  document.getElementById("res-score").innerText = `${score} / ${quizList.length}`;

  const box = document.getElementById("res-mistakes-box");
  if (sessionMistakes.length > 0) {
    let html = "<strong>今回間違えた単語:</strong><ul style='padding-left:1.2rem; margin-top:0.3rem;'>";
    sessionMistakes.forEach(m => {
      html += `<li><strong>${m.word}</strong>: ${m.meaning}</li>`;
    });
    html += "</ul>";
    box.innerHTML = html;
  } else {
    box.innerHTML = "<p style='color:var(--correct); font-weight:bold;'>全問正解！素晴らしいです！</p>";
  }
}

function showHistory() {
  showScreen("screen-history");
  const content = document.getElementById("history-content");
  const mistakeKeys = Object.keys(mistakes);

  if (mistakeKeys.length === 0) {
    content.innerHTML = "<p>現在、苦手（ミスした）単語はありません！</p>";
    return;
  }

  let html = "";
  vocabulary.forEach(v => {
    if (mistakes[v.word]) {
      html += `
        <div class="history-item">
          <div><strong>${v.word}</strong> (${v.meaning})</div>
          <div class="wrong-tag">ミス ${mistakes[v.word]} 回</div>
        </div>`;
    }
  });
  content.innerHTML = html;
}

function clearHistory() {
  if (confirm("過去の間違い記録をすべてリセットしますか？")) {
    mistakes = {};
    localStorage.removeItem("vocab_mistakes");
    showHistory();
  }
}

function showScreen(id) {
  ["screen-top", "screen-quiz", "screen-result", "screen-history"].forEach(s => {
    document.getElementById(s).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
}

function backToTop() {
  showScreen("screen-top");
}
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .catch(error => console.error(error));
  });
}
</script>
